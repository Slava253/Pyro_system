<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>POS — Система</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1115;--panel:#171a21;--panel2:#1f232c;--line:#2a2f3a;
  --text:#e8ecf1;--muted:#8b93a7;--accent:#4f8cff;
  --green:#22c55e;--amber:#f59e0b;--red:#ef4444;
}
body{background:var(--bg);color:var(--text);font-family:'Segoe UI',system-ui,-apple-system,sans-serif;min-height:100vh;font-size:15px}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:var(--panel);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:50;flex-wrap:wrap}
.logo{font-weight:700;font-size:18px;letter-spacing:.3px}
nav{display:flex;gap:8px;flex-wrap:wrap}
nav button{background:var(--panel2);color:var(--muted);border:1px solid var(--line);padding:9px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
nav button:hover{color:var(--text);border-color:#3a4152}
nav button.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.spacer{flex:1}
.clock{color:var(--muted);font-variant-numeric:tabular-nums;font-size:14px}
.conn{font-size:13px;font-weight:600;color:var(--muted)}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--muted);border-radius:10px;padding:8px 12px;cursor:pointer}
.icon-btn:hover{color:var(--red);border-color:var(--red)}
main{padding:20px;max-width:1500px;margin:0 auto}
.view{display:none}
.view.active{display:block}
h2{font-size:16px;font-weight:700;margin-bottom:14px;letter-spacing:.2px}
h3.sub{font-size:13px;color:var(--muted);margin:18px 0 8px;text-transform:uppercase;letter-spacing:.6px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}

.cashier-grid{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
@media(max-width:1000px){.cashier-grid{grid-template-columns:1fr}}
.products{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;max-height:520px;overflow:auto;padding-right:4px}
.product{position:relative;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;transition:.15s;text-align:left}
.product:hover{border-color:var(--accent);transform:translateY(-2px)}
.product .p-name{font-weight:600;font-size:14px;margin-bottom:6px;padding-right:24px}
.product .p-price{color:var(--accent);font-weight:700;font-size:14px}
.product .p-del{
  position:absolute;top:6px;right:6px;
  width:22px;height:22px;border-radius:6px;
  background:rgba(239,68,68,.12);color:#f87171;
  border:1px solid rgba(239,68,68,.35);
  font-size:14px;font-weight:700;line-height:1;
  cursor:pointer;opacity:0;transition:.15s;
  display:flex;align-items:center;justify-content:center;
  padding:0;font-family:inherit;
}
.product:hover .p-del{opacity:1}
.product .p-del:hover{background:var(--red);color:#fff;border-color:var(--red)}
.add-form{display:grid;grid-template-columns:1fr 100px auto;gap:8px}
@media(max-width:600px){.add-form{grid-template-columns:1fr}}
input{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 12px;border-radius:10px;font-size:14px;outline:none;font-family:inherit}
input:focus{border-color:var(--accent)}
button{font-family:inherit}
.btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);padding:10px 16px;border-radius:10px;cursor:pointer;font-size:14px;font-weight:600;transition:.15s}
.btn:hover{border-color:#3a4152}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.1)}
.btn.green{background:var(--green);border-color:var(--green);color:#04250f}
.btn.green:hover{filter:brightness(1.1)}
.btn.danger{background:rgba(239,68,68,.1);border-color:rgba(239,68,68,.4);color:#f87171}
.btn.danger:hover{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:transparent}
.btn.block{width:100%;margin-top:12px;padding:13px}
.btn:disabled{opacity:.35;cursor:not-allowed}
.toolbar{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.toolbar h2{margin:0}
.toolbar .btn{margin-left:auto;padding:7px 12px;font-size:12.5px}

.cart{display:flex;flex-direction:column;gap:8px;min-height:60px;max-height:340px;overflow:auto}
.cart-empty{color:var(--muted);font-size:14px;text-align:center;padding:24px 0}
.cart-row{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.cart-row .ci-name{flex:1;font-size:14px}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:26px;height:26px;border-radius:7px;background:#2b3140;border:1px solid var(--line);color:var(--text);cursor:pointer;font-weight:700;line-height:1}
.qty button:hover{background:var(--accent);border-color:var(--accent)}
.qty span{min-width:20px;text-align:center;font-weight:600}
.ci-price{font-weight:700;font-size:14px;min-width:70px;text-align:right}
.del{background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px}
.del:hover{color:var(--red)}
.cart-total{display:flex;justify-content:space-between;align-items:center;margin-top:16px;padding-top:14px;border-top:1px dashed var(--line);font-size:16px}
.cart-total b{font-size:20px;color:var(--accent)}

.orders-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.order-card{background:var(--panel2);border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:10px}
.order-head{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.order-num{font-size:20px;font-weight:800;letter-spacing:.5px}
.badge{font-size:11px;font-weight:700;padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.4px}
.badge.online{background:rgba(79,140,255,.15);color:#7fa9ff;border:1px solid rgba(79,140,255,.4)}
.badge.paid{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.badge.unpaid{background:rgba(239,68,68,.15);color:#f87171;border:1px solid rgba(239,68,68,.4)}
.badge.cook{background:rgba(245,158,11,.15);color:#fbbf24;border:1px solid rgba(245,158,11,.4)}
.badge.ready{background:rgba(34,197,94,.15);color:#4ade80;border:1px solid rgba(34,197,94,.4)}
.order-phone{font-size:12px;color:var(--muted);margin-top:2px}
.order-items{list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px;color:#c3cad8}
.order-items li{display:flex;justify-content:space-between;gap:8px}
.order-total{font-weight:700;display:flex;justify-content:space-between;font-size:14px;border-top:1px dashed var(--line);padding-top:8px}
.order-actions{display:flex;gap:8px;flex-wrap:wrap}
.order-actions .btn{flex:1;padding:9px 10px;font-size:13px;min-width:80px}

.notes{display:flex;flex-direction:column;gap:8px;margin-bottom:16px}
.note{display:flex;align-items:center;gap:12px;background:rgba(34,197,94,.12);border:1px solid rgba(34,197,94,.45);color:#6ee7a0;padding:12px 16px;border-radius:12px;font-weight:600;animation:slideIn .3s ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
.note button{margin-left:auto;background:none;border:none;color:inherit;font-size:18px;cursor:pointer;opacity:.7}
.note button:hover{opacity:1}

.board-head{display:flex;align-items:baseline;gap:16px;margin-bottom:16px;flex-wrap:wrap}
.hint{color:var(--muted);font-size:13px}
.kitchen-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
.kcard{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--amber);border-radius:14px;padding:16px;cursor:pointer;user-select:none;transition:.15s}
.kcard:hover{border-color:var(--accent);border-left-color:var(--amber);transform:translateY(-2px)}
.kcard:active{transform:scale(.98)}
.kcard .knum{font-size:26px;font-weight:800;margin-bottom:4px}
.kcard .kmeta{font-size:12px;color:var(--muted);margin-bottom:10px}
.kcard ul{list-style:none;display:flex;flex-direction:column;gap:6px}
.kcard li{display:flex;gap:8px;font-size:15px}
.kcard li b{color:var(--accent);min-width:28px}
.kempty{color:var(--muted);padding:40px;text-align:center;grid-column:1/-1;border:2px dashed var(--line);border-radius:16px}

.columns{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:800px){.columns{grid-template-columns:1fr}}
.col-title{font-size:15px;text-transform:uppercase;letter-spacing:1.2px;padding-bottom:10px;border-bottom:2px solid}
.col-title.cooking{color:var(--amber);border-color:var(--amber)}
.col-title.ready{color:var(--green);border-color:var(--green)}
.board-list{display:flex;flex-direction:column;gap:12px;margin-top:14px}
.bcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:22px 16px;display:flex;justify-content:center;align-items:center;animation:slideIn .3s}
.bcard .bnum{font-size:44px;font-weight:900;line-height:1;letter-spacing:-1px}
.bcard.cooking .bnum{color:var(--amber)}
.bcard.ready .bnum{color:var(--green)}
.bempty{color:var(--muted);padding:40px;text-align:center;border:2px dashed var(--line);border-radius:16px;font-size:14px}

.modal{position:fixed;inset:0;z-index:200;display:flex;align-items:center;justify-content:center;padding:20px}
.modal.hidden{display:none}
.modal-backdrop{position:absolute;inset:0;background:rgba(0,0,0,.7);backdrop-filter:blur(3px)}
.modal-body{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:20px;max-width:380px;width:100%;max-height:90vh;overflow:auto;animation:slideIn .25s}
.receipt{background:#fff;color:#111;border-radius:10px;padding:20px 18px;font-family:'Courier New',monospace;font-size:13px;line-height:1.5}
.r-title{text-align:center;font-weight:800;font-size:17px;letter-spacing:2px}
.r-sub{text-align:center;font-size:13px;margin-top:2px}
.r-line{border-top:1px dashed #999;margin:10px 0}
.r-item{display:flex;justify-content:space-between;gap:10px}
.r-total{font-weight:800;font-size:15px}
.r-thanks{text-align:center;margin-top:14px;font-size:12px;color:#555}
.modal-actions{display:flex;gap:10px;margin-top:16px}
.modal-actions .btn{flex:1}
.pay-title{text-align:center;font-size:22px;font-weight:800;margin-bottom:4px}
.pay-sub{text-align:center;color:var(--muted);font-size:13px;margin-bottom:14px}

#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:10px;z-index:300}
.toast{background:var(--panel2);border:1px solid var(--accent);color:var(--text);padding:14px 18px;border-radius:12px;font-weight:600;box-shadow:0 8px 30px rgba(0,0,0,.5);animation:slideIn .3s;max-width:340px}

@media print{
  body>*:not(#receipt-modal){display:none!important}
  #receipt-modal{position:static;display:block!important;padding:0}
  .modal-backdrop,.modal-actions{display:none!important}
  .modal-body{border:none;box-shadow:none;background:#fff;max-width:none;padding:0}
  .receipt{border-radius:0;padding:0}
}
</style>
</head>
<body>

<header>
  <div class="logo">🍽 Ресторан · Система</div>
  <nav>
    <button data-view="cashier" class="active">Касса</button>
    <button data-view="kitchen">Табло кухня</button>
    <button data-view="board">Табло заказов</button>
  </nav>
  <div class="spacer"></div>
  <span class="conn" id="connStatus">● Подключение…</span>
  <div class="clock" id="clock"></div>
  <button class="icon-btn" title="Сбросить заказы" onclick="resetOrders()">⟲</button>
</header>

<main>
  <section id="view-cashier" class="view active">
    <div id="notes" class="notes"></div>
    <div class="cashier-grid">
      <div class="panel">
        <div class="toolbar">
          <h2>Товары</h2>
          <button class="btn danger" onclick="deleteAllProducts()">🗑 Очистить всё</button>
        </div>
        <div id="products" class="products"></div>
        <h3 class="sub">Добавить товар в систему</h3>
        <div class="add-form">
          <input id="newName" placeholder="Название товара">
          <input id="newPrice" type="number" min="1" placeholder="Цена ₽">
          <button class="btn primary" onclick="addProduct()">+ Добавить</button>
        </div>
      </div>

      <div class="panel">
        <h2>Корзина</h2>
        <div id="cart" class="cart"></div>
        <div class="cart-total"><span>Итого</span><b id="cartTotal">0 ₽</b></div>
        <button class="btn primary block" onclick="checkout()">Оформить заказ</button>
      </div>
    </div>

    <div class="panel" style="margin-top:20px">
      <h2>Заказы в работе</h2>
      <div id="cashierOrders" class="orders-grid"></div>
    </div>
  </section>

  <section id="view-kitchen" class="view">
    <div class="board-head">
      <h2 style="margin:0">Табло кухни</h2>
      <span class="hint">Двойной клик по заказу → «готов на кухне»</span>
    </div>
    <div id="kitchenOrders" class="kitchen-grid"></div>
  </section>

  <section id="view-board" class="view">
    <div class="columns">
      <div class="col">
        <h2 class="col-title cooking">Готовится</h2>
        <div id="boardCooking" class="board-list"></div>
      </div>
      <div class="col">
        <h2 class="col-title ready">Готов</h2>
        <div id="boardReady" class="board-list"></div>
      </div>
    </div>
  </section>
</main>

<div id="receipt-modal" class="modal hidden">
  <div class="modal-backdrop" onclick="closeModal()"></div>
  <div class="modal-body">
    <div id="modalTop"></div>
    <div id="receipt" class="receipt"></div>
    <div class="modal-actions">
      <button class="btn primary" onclick="window.print()">🖨 Печать</button>
      <button class="btn" onclick="closeModal()">Закрыть</button>
    </div>
  </div>
</div>

<div id="toasts"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {
  getDatabase, ref, onValue, set, update, push, remove, runTransaction
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyBlZ5ZtyTXgtXxSJAx1jOxwhTrzlHRJmo",
  authDomain: "bk-cashier.firebaseapp.com",
  databaseURL: "https://bk-cashier-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "bk-cashier",
  storageBucket: "bk-cashier.firebasestorage.app",
  messagingSenderId: "385000840969",
  appId: "1:385000840969:web:1ec8d09176b6551dc0fdd8"
};
const app = initializeApp(firebaseConfig);
const db  = getDatabase(app);

let state = { products:{}, orders:{}, notes:{} };
let cart = [];
let seenNotes = null;
let kitchenSeen = null;

const $ = id => document.getElementById(id);
const fmt = n => n.toLocaleString('ru-RU') + ' ₽';
const esc = s => String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function formatPhone(digits){
  if(!digits || digits.length < 10) return digits || '';
  const d = digits.slice(-10);
  return `+7 (${d.slice(0,3)}) ${d.slice(3,6)}-${d.slice(6,8)}-${d.slice(8,10)}`;
}

function toast(text){
  const el = document.createElement('div');
  el.className = 'toast';
  el.textContent = text;
  $('toasts').appendChild(el);
  setTimeout(()=>{ el.style.opacity='0'; el.style.transition='.4s'; setTimeout(()=>el.remove(),400); }, 4200);
}

function beep(){
  try{
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type='sine'; o.frequency.value=880;
    g.gain.setValueAtTime(0.0001, ctx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.15, ctx.currentTime + 0.01);
    g.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.30);
    o.start(); o.stop(ctx.currentTime + 0.31);
  }catch(e){}
}

onValue(ref(db, '.info/connected'), snap => {
  const online = snap.val();
  const el = $('connStatus');
  el.textContent = online ? '● Онлайн' : '● Оффлайн';
  el.style.color = online ? 'var(--green)' : 'var(--red)';
});

document.querySelectorAll('nav button').forEach(b=>{
  b.onclick = () => {
    document.querySelectorAll('nav button').forEach(x=>x.classList.remove('active'));
    document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
    b.classList.add('active');
    $('view-' + b.dataset.view).classList.add('active');
  };
});

setInterval(()=>{
  const d = new Date();
  $('clock').textContent = d.toLocaleTimeString('ru-RU', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
}, 1000);

onValue(ref(db, 'products'), snap => {
  state.products = snap.val() || {};
  renderProducts();
  cart = cart.filter(i => state.products[i.productKey]);
  renderCart();
});

onValue(ref(db, 'orders'), snap => {
  state.orders = snap.val() || {};
  renderCashierOrders();
  renderKitchen();
  renderBoard();
});

onValue(ref(db, 'notes'), snap => {
  const notes = snap.val() || {};
  const keys = Object.keys(notes);
  if(seenNotes === null){
    seenNotes = new Set(keys);
  } else {
    keys.forEach(k => {
      if(!seenNotes.has(k)){
        seenNotes.add(k);
        toast('🔔 ' + notes[k].text);
        beep();
      }
    });
  }
  state.notes = notes;
  renderNotes();
});

function addProductById(key){
  const p = state.products[key];
  if(!p) return;
  const ex = cart.find(i => i.productKey === key);
  if(ex) ex.qty++;
  else cart.push({productKey:key, name:p.name, price:p.price, qty:1});
  renderCart();
}
function changeQty(idx, delta){
  cart[idx].qty += delta;
  if(cart[idx].qty <= 0) cart.splice(idx,1);
  renderCart();
}
function removeItem(idx){ cart.splice(idx,1); renderCart(); }
function cartTotal(){ return cart.reduce((s,i)=>s + i.price*i.qty, 0); }

function renderCart(){
  const box = $('cart');
  if(!cart.length){
    box.innerHTML = '<div class="cart-empty">Корзина пуста</div>';
  } else {
    box.innerHTML = cart.map((i,idx)=>`
      <div class="cart-row">
        <span class="ci-name">${esc(i.name)}</span>
        <div class="qty">
          <button onclick="changeQty(${idx},-1)">−</button>
          <span>${i.qty}</span>
          <button onclick="changeQty(${idx},1)">+</button>
        </div>
        <span class="ci-price">${fmt(i.price*i.qty)}</span>
        <button class="del" onclick="removeItem(${idx})">×</button>
      </div>
    `).join('');
  }
  $('cartTotal').textContent = fmt(cartTotal());
}

function renderProducts(){
  const entries = Object.entries(state.products);
  $('products').innerHTML = entries.length
    ? entries.map(([key, p]) => `
        <div class="product" onclick="addProductById('${key}')">
          <button class="p-del" title="Удалить товар"
                  onclick="event.stopPropagation(); deleteProduct('${key}', '${esc(p.name).replace(/'/g,"\\'")}')">×</button>
          <div class="p-name">${esc(p.name)}</div>
          <div class="p-price">${fmt(p.price)}</div>
        </div>
      `).join('')
    : '<div class="cart-empty">Товаров нет. Добавьте первый товар ниже.</div>';
}

async function addProduct(){
  const name = $('newName').value.trim();
  const price = parseInt($('newPrice').value, 10);
  if(!name || !price || price <= 0){ toast('Введите название и цену'); return; }
  try {
    await push(ref(db, 'products'), {name, price});
    $('newName').value = '';
    $('newPrice').value = '';
    toast(`Товар «${name}» добавлен`);
  } catch(e){ toast('Ошибка: ' + e.message); }
}

async function deleteProduct(key, name){
  if(!confirm(`Удалить товар «${name}»?`)) return;
  try {
    await remove(ref(db, `products/${key}`));
    cart = cart.filter(i => i.productKey !== key);
    renderCart();
    toast(`Товар «${name}» удалён`);
  } catch(e){
    toast('Ошибка удаления: ' + e.message);
  }
}

async function deleteAllProducts(){
  const count = Object.keys(state.products).length;
  if(!count){ toast('Товаров и так нет'); return; }
  if(!confirm(`Удалить ВСЕ ${count} товаров? Это действие необратимо.`)) return;
  try {
    await remove(ref(db, 'products'));
    cart = [];
    renderCart();
    toast('Все товары удалены');
  } catch(e){ toast('Ошибка: ' + e.message); }
}

async function createOrder(items, total, source, phone){
  const txn = await runTransaction(ref(db, 'settings/nextOrderId'), cur => (cur || 0) + 1);
  const num = txn.snapshot.val();
  const orderRef = push(ref(db, 'orders'));
  const payload = {
    num, items, total, source,
    paid:false, ready:false, issued:false, kitchenDone:false,
    createdAt: Date.now()
  };
  if(phone) payload.phone = phone;
  await set(orderRef, payload);
  return num;
}

async function checkout(){
  if(!cart.length){ toast('Корзина пуста'); return; }
  const items = cart.map(i => ({name:i.name, price:i.price, qty:i.qty}));
  const total = cartTotal();
  try {
    const num = await createOrder(items, total, 'pos', null);
    cart = [];
    renderCart();
    toast(`Заказ №${num} оформлен — отправлен на кухню`);
  } catch(e){ toast('Ошибка: ' + e.message); }
}

async function payOrder(key){
  const o = state.orders[key];
  if(!o || o.paid) return;
  try {
    await update(ref(db, `orders/${key}`), {paid:true});
    openReceipt({...o, paid:true});
    toast(`Заказ №${o.num} оплачен`);
  } catch(e){ toast('Ошибка: ' + e.message); }
}

async function markReady(key){
  const o = state.orders[key];
  if(!o) return;
  await update(ref(db, `orders/${key}`), {ready:true});
  toast(`Заказ №${o.num} — «Готов»`);
}

async function markIssued(key){
  const o = state.orders[key];
  if(!o) return;
  await update(ref(db, `orders/${key}`), {issued:true});
  toast(`Заказ №${o.num} выдан`);
}

async function kitchenDone(key){
  const o = state.orders[key];
  if(!o || o.kitchenDone) return;
  try {
    await update(ref(db, `orders/${key}`), {kitchenDone:true});
    await push(ref(db, 'notes'), {
      orderKey: key,
      num: o.num,
      text: `Заказ №${o.num} готов на кухне`,
      ts: Date.now()
    });
  } catch(e){ toast('Ошибка: ' + e.message); }
}

async function dismissNote(noteKey){
  await remove(ref(db, `notes/${noteKey}`));
}

function renderNotes(){
  const box = $('notes');
  const entries = Object.entries(state.notes).sort((a,b)=> a[1].ts - b[1].ts);
  if(!entries.length){ box.innerHTML = ''; return; }
  box.innerHTML = entries.map(([k, n]) => `
    <div class="note">
      <span>🔔 ${esc(n.text)}</span>
      <button onclick="dismissNote('${k}')">×</button>
    </div>
  `).join('');
}

function renderCashierOrders(){
  const list = Object.entries(state.orders)
    .filter(([,o]) => !o.issued)
    .sort((a,b) => b[1].num - a[1].num);
  const box = $('cashierOrders');

  if(!list.length){
    box.innerHTML = '<div class="kempty">Нет активных заказов</div>';
    return;
  }

  box.innerHTML = list.map(([key, o]) => {
    const statusBadge = o.ready
      ? '<span class="badge ready">Готов</span>'
      : '<span class="badge cook">Готовится</span>';
    return `
      <div class="order-card">
        <div class="order-head">
          <span class="order-num">№${o.num}</span>
          ${o.source === 'online' ? '<span class="badge online">Онлайн</span>' : ''}
          <span class="badge ${o.paid ? 'paid' : 'unpaid'}">${o.paid ? 'Оплачен' : 'Не оплачен'}</span>
          ${statusBadge}
        </div>
        ${o.phone ? `<div class="order-phone">📱 ${formatPhone(o.phone)}</div>` : ''}
        <ul class="order-items">
          ${o.items.map(i=>`<li><span>${i.qty}× ${esc(i.name)}</span><span>${i.price*i.qty} ₽</span></li>`).join('')}
        </ul>
        <div class="order-total"><span>Итого</span><span>${fmt(o.total)}</span></div>
        <div class="order-actions">
          ${!o.paid ? `<button class="btn green" onclick="payOrder('${key}')">Оплатить</button>` : ''}
          ${o.paid ? `<button class="btn" onclick="openReceiptByKey('${key}')">🧾 Чек</button>` : ''}
          ${!o.ready ? `<button class="btn primary" onclick="markReady('${key}')">Готово</button>` : ''}
          ${o.ready ? `<button class="btn" onclick="markIssued('${key}')">Выдан</button>` : ''}
        </div>
      </div>
    `;
  }).join('');
}

function renderKitchen(){
  const list = Object.entries(state.orders)
    .filter(([,o]) => !o.kitchenDone && !o.issued)
    .sort((a,b) => a[1].num - b[1].num);

  if(kitchenSeen === null){
    kitchenSeen = new Set(list.map(([k])=>k));
  } else {
    let newCount = 0;
    list.forEach(([k]) => {
      if(!kitchenSeen.has(k)){ kitchenSeen.add(k); newCount++; }
    });
    if(newCount > 0) beep();
  }

  const box = $('kitchenOrders');
  if(!list.length){
    box.innerHTML = '<div class="kempty">Новых заказов нет</div>';
    return;
  }

  box.innerHTML = list.map(([key, o]) => {
    const t = new Date(o.createdAt).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
    return `
      <div class="kcard" ondblclick="kitchenDone('${key}')">
        <div class="knum">№ ${o.num}</div>
        <div class="kmeta">
          ${t} · ${o.source === 'online' ? '🌐 Онлайн · оплата при получении' : '🏪 Касса'}
          ${o.phone ? ' · 📱 ' + formatPhone(o.phone) : ''}
        </div>
        <ul>
          ${o.items.map(i=>`<li><b>${i.qty}×</b> ${esc(i.name)}</li>`).join('')}
        </ul>
      </div>
    `;
  }).join('');
}

function renderBoard(){
  const active = Object.entries(state.orders).filter(([,o]) => !o.issued);
  const cooking = active.filter(([,o]) => !o.ready).sort((a,b)=>a[1].num - b[1].num);
  const ready   = active.filter(([,o]) => o.ready).sort((a,b)=>a[1].num - b[1].num);

  const card = ([,o]) => `
    <div class="bcard ${o.ready ? 'ready' : 'cooking'}">
      <div class="bnum">№${o.num}</div>
    </div>
  `;

  $('boardCooking').innerHTML = cooking.length
    ? cooking.map(card).join('')
    : '<div class="bempty">Пусто</div>';
  $('boardReady').innerHTML = ready.length
    ? ready.map(card).join('')
    : '<div class="bempty">Пусто</div>';
}

function receiptHTML(o){
  const d = new Date(o.createdAt);
  const dateStr = d.toLocaleString('ru-RU', {
    day:'2-digit', month:'2-digit', year:'numeric', hour:'2-digit', minute:'2-digit'
  });
  return `
    <div class="r-title">РЕСТОРАН</div>
    <div class="r-sub">Чек № ${o.num}</div>
    ${o.phone ? `<div class="r-sub">${formatPhone(o.phone)}</div>` : ''}
    <div class="r-line"></div>
    ${o.items.map(i=>`<div class="r-item"><span>${i.qty}× ${esc(i.name)}</span><span>${i.price*i.qty} ₽</span></div>`).join('')}
    <div class="r-line"></div>
    <div class="r-item r-total"><span>ИТОГО</span><span>${o.total} ₽</span></div>
    <div class="r-line"></div>
    <div class="r-item"><span>${o.source === 'online' ? 'Онлайн-заказ' : 'Касса'}</span><span>${o.paid ? 'Оплачено' : 'Не оплачено'}</span></div>
    <div class="r-item"><span>${dateStr}</span><span></span></div>
    <div class="r-thanks">Спасибо за заказ!</div>
  `;
}

function openReceipt(o){
  $('modalTop').innerHTML = `
    <div class="pay-title" style="color:var(--green)">Заказ №${o.num} оплачен</div>
    <div class="pay-sub">Чек сформирован</div>
  `;
  $('receipt').innerHTML = receiptHTML(o);
  $('receipt-modal').classList.remove('hidden');
}

function openReceiptByKey(key){
  const o = state.orders[key];
  if(o) openReceipt(o);
}

function closeModal(){ $('receipt-modal').classList.add('hidden'); }

async function resetOrders(){
  if(!confirm('Удалить все заказы и уведомления?')) return;
  try {
    await remove(ref(db, 'orders'));
    await remove(ref(db, 'notes'));
    toast('Заказы сброшены');
  } catch(e){ toast('Ошибка: ' + e.message); }
}

Object.assign(window, {
  addProductById, changeQty, removeItem, checkout, addProduct,
  deleteProduct, deleteAllProducts,
  payOrder, markReady, markIssued, kitchenDone, dismissNote,
  openReceiptByKey, closeModal, resetOrders
});
</script>
</body>
</html>
